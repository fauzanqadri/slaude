# Values for the local cluster on the Helm chart (up.sh --helm, helm-overlay.ts).
# The same objects as deploy/k8s-scale, with the CPU HPA instead of KEDA, as
# kustomization.yaml uses; its patches then apply unchanged.
topology: scale
image:
  repository: ghcr.io/REPLACE/slaude
  tag: latest
  pullPolicy: Always
home:
  storageClass: REPLACE-rwx-class
  size: 20Gi
scale:
  names:
    config: slaude-scale-config
    gatewayConfig: slaude-scale-gateway-config
    nodeManifest: slaude-node-manifest
  secrets:
    gateway: slaude-scale-secrets
    node: slaude-scale-node-secrets
  config:
    SLAUDE_MODEL: "claude-sonnet-4-6"
    SLACK_OAUTH_REDIRECT_URL: "https://slaude-gw.example.com/slack/oauth/callback"
  gatewayConfig:
    SLAUDE_VAULT_AUTH: "kubernetes"
    SLAUDE_VAULT_ROLE: "slaude-gateway"
    SLAUDE_VAULT_K8S_TOKEN_PATH: "/var/run/secrets/vault/token"
    SLAUDE_VAULT_ALLOWED_PREFIXES: "secret/slaude/personas/{persona}"
    SLAUDE_OUTBOUND_INTERNAL_HOSTS: ""
  nodes:
    - label: default
      replicas: 2
      credentialSecret: slaude-scale-node-cred-default
      minReplicas: 2
      maxReplicas: 20
    - label: finance
      replicas: 2
      credentialSecret: slaude-scale-node-cred-finance
      minReplicas: 2
      maxReplicas: 10
  autoscale:
    mode: hpa
ingress:
  enabled: true
  className: nginx
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
  host: slaude-gw.example.com
  tlsSecret: slaude-gw-tls
