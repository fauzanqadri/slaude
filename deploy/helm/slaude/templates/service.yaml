{{- $scale := eq .Values.topology "scale" }}
{{- $component := ternary "gateway" "agent" $scale }}
{{- $name := ternary (include "slaude.gatewayName" .) (include "slaude.fullname" .) $scale }}
{{- $port := ternary .Values.scale.gateway.port .Values.mono.port $scale }}
{{- if or $scale .Values.mono.service.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "slaude.labels" (dict "root" . "component" $component) | nindent 4 }}
spec:
  selector:
    {{- include "slaude.selector" (dict "root" . "component" $component) | nindent 4 }}
  ports:
    - name: http
      port: {{ $port }}
      targetPort: http
{{- end }}
{{- if .Values.ingress.enabled }}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ $name }}
  namespace: {{ .Release.Namespace }}
  {{- with .Values.commonLabels }}
  labels:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  {{- with .Values.ingress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- with .Values.ingress.className }}
  ingressClassName: {{ . }}
  {{- end }}
  {{- $host := required "ingress.host is required when ingress.enabled" .Values.ingress.host }}
  {{- with .Values.ingress.tlsSecret }}
  tls:
    - hosts: [{{ $host }}]
      secretName: {{ . }}
  {{- end }}
  rules:
    - host: {{ $host }}
      http:
        paths:
          # Only /slack is public. /v1 (the node control plane) and /metrics
          # stay inside the cluster.
          - path: {{ .Values.ingress.path }}
            pathType: Prefix
            backend:
              service:
                name: {{ $name }}
                port:
                  name: http
{{- end }}
