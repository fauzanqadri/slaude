{{- if eq .Values.topology "mono" }}
{{- $m := .Values.mono }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "slaude.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "slaude.labels" (dict "root" . "component" "agent") | nindent 4 }}
spec:
  # One replica: a mono pod owns its $SLAUDE_HOME and, in Socket Mode, the
  # single Slack connection.
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "slaude.selector" (dict "root" . "component" "agent") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "slaude.labels" (dict "root" . "component" "agent") | nindent 8 }}
    spec:
      {{- include "slaude.podExtras" . | nindent 6 }}
      containers:
        - name: slaude
          image: {{ include "slaude.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          {{- if or $m.secretName $m.config $m.extraEnvFrom }}
          envFrom:
            {{- with $m.secretName }}
            - secretRef:
                name: {{ . }}
            {{- end }}
            {{- if $m.config }}
            - configMapRef:
                name: {{ include "slaude.configName" . }}
            {{- end }}
            {{- with $m.extraEnvFrom }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          {{- end }}
          env:
            - name: SLAUDE_HOME
              value: {{ .Values.home.mountPath }}
            # Socket Mode serves health on SLAUDE_HEALTH_PORT; HTTP mode serves
            # Slack and health on SLAUDE_HTTP_PORT. One port either way.
            - name: SLAUDE_HEALTH_PORT
              value: {{ $m.port | quote }}
            - name: SLAUDE_HTTP_PORT
              value: {{ $m.port | quote }}
            {{- include "slaude.sandboxEnv" . | nindent 12 }}
            {{- with $m.env }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          ports:
            - name: http
              containerPort: {{ $m.port }}
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          volumeMounts:
            - name: slaude-home
              mountPath: {{ .Values.home.mountPath }}
            {{- include "slaude.agentApiMount" . | nindent 12 }}
            {{- with $m.extraVolumeMounts }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          resources:
            {{- toYaml $m.resources | nindent 12 }}
      volumes:
        - name: slaude-home
          persistentVolumeClaim:
            claimName: {{ include "slaude.homeClaim" . }}
        {{- include "slaude.agentApiVolume" . | nindent 8 }}
        {{- with $m.extraVolumes }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
{{- end }}
