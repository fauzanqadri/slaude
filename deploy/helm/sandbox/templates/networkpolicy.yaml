{{- if .Values.networkPolicy.enabled }}
{{- $np := .Values.networkPolicy }}
# Only slaude's pods may call the server.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "sandbox.fullname" . }}-server
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "sandbox.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "sandbox.selector" . | nindent 6 }}
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              {{- toYaml $np.clientPodSelector | nindent 14 }}
          {{- with $np.clientNamespaceSelector }}
          namespaceSelector:
            matchLabels:
              {{- toYaml . | nindent 14 }}
          {{- end }}
      ports:
        - { protocol: TCP, port: {{ .Values.port }} }
{{- if eq .Values.backend "k8s" }}
---
# Sandbox pods: no inbound connection at all, and only the listed egress.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "sandbox.fullname" . }}-sandboxes
  namespace: {{ include "sandbox.podNamespace" . }}
  labels:
    {{- include "sandbox.labels" . | nindent 4 }}
spec:
  podSelector:
    matchExpressions:
      - { key: sandbox/session, operator: Exists }
  policyTypes: [Ingress, Egress]
  ingress: []
  egress:
    {{- toYaml $np.sandboxEgress | nindent 4 }}
{{- end }}
{{- end }}
